version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: digital-store-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: digitalstore
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: store_pass_123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_user -d digitalstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital-store-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: store_user
      DATABASE_PASSWORD: store_pass_123
      DATABASE_NAME: digitalstore
      PORT: 3000
      ADMIN_TOKEN: admin_secret_token_2024
    depends_on:
      db:
        condition: service_healthy
    command: node dist/main.js

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital-store-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
